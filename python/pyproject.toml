[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vierrataleai"
version = "0.1.0b14"
description = "VierrataleAI - Intelligent terminal assistant"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vierratale" }]
keywords = ["ai", "chatbot", "terminal", "assistant", "llm"]
dependencies = [
    "rich>=13.0"
]

[project.scripts]
vierrataleai = "vierrataleai.cli:main"
vierratale = "vierrataleai.cli:main"
